<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静夜思 - 李白</title>
    <style>
        /* 简单居中和字体样式 */
        body {
            font-family: 'Songti SC', serif; /* 使用宋体或衬线字体 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4; /* 浅灰色背景 */
            color: #333; /* 深色文字 */
        }
        .poem-container {
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            line-height: 2.0;
            font-size: 24px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }
        .author {
            margin-top: 20px;
            font-style: italic;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="poem-container">
        <h1>静夜思</h1>
        <p>床前明月光，</p>
        <p>疑是地上霜。</p>
        <p>举头望明月，</p>
        <p>低头思故乡。</p>
        <p class="author">—— [唐] 李白</p>
    </div>
</body>
</html>
